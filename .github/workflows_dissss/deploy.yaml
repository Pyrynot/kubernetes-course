name: Build and publish application

on:
  push:



jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest
    environment: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish logger
        run: |-
          docker build -f part4/4.07/Dockerfile.logger --tag "pyrynot/logger:$GITHUB_SHA" part4/4.07
          docker push "pyrynot/logger:$GITHUB_SHA"

      - name: Build and publish pingpong
        run: |-
          docker build -f part4/4.07/Dockerfile.pingpong --tag "pyrynot/pingpong:$GITHUB_SHA" part4/4.07
          docker push "pyrynot/pingpong:$GITHUB_SHA"

      - name: Build and publish reader
        run: |-
          docker build -f part4/4.07/Dockerfile.reader --tag "pyrynot/reader:$GITHUB_SHA" part4/4.07
          docker push "pyrynot/reader:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2


      - name: Use right images
        run: |-
          cd part4/4.07
          kustomize edit set image logger=mluukkai/logger:$GITHUB_SHA
          kustomize edit set image pingpong=mluukkai/pingpong:$GITHUB_SHA
          kustomize edit set image reader=mluukkai/reader:$GITHUB_SHA


      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v9
        with:
          add: 'kustomization.yaml'
          message: New version released ${{ github.sha }}