name: Deploy to staging

on: 
  push: 
    branches:
      - main

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest
    environment: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish app
        run: |-
          cd part4/4.08
          docker build -f Dockerfile.app --tag "pyrynot/todo-app:$GITHUB_SHA" .
          docker push "pyrynot/todo-app:$GITHUB_SHA"

      - name: Build and publish backend
        run: |-
          cd part4/4.08
          docker build -f Dockerfile.backend --tag "pyrynot/todo-backend:$GITHUB_SHA" .
          docker push "pyrynot/todo-backend:$GITHUB_SHA"

      - name: Build and publish broadcaster
        run: |-
          cd part4/4.08
          docker build -f Dockerfile.broadcaster --tag "pyrynot/broadcaster:$GITHUB_SHA" .
          docker push "pyrynot/broadcaster:$GITHUB_SHA"

      - name: Build and publish random-todo
        run: |-
            cd part4/4.08
            docker build -f Dockerfile.cron --tag "pyrynot/random-todo-generator:$GITHUB_SHA" .
            docker push "pyrynot/random-todo-generator:$GITHUB_SHA"

      - name: Build and publish pg-backup
        run: |-
            cd part4/4.08
            docker build -f Dockerfile.broadcaster --tag "pyrynot/pg-backup:$GITHUB_SHA" .
            docker push "pyrynot/pg-backup:$GITHUB_SHA"


      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2


      - name: Use right images
        run: |-
          cd part4/4.08/manifests/staging
          kustomize edit set image PROJECT/CRON_IMAGE=pyrynot/random-todo-generator:$GITHUB_SHA
          kustomize edit set image PROJECT/BACKEND_IMAGE=pyrynot/todo-backend:$GITHUB_SHA
          kustomize edit set image PROJECT/APP_IMAGE=mluukkai/todo-app:$GITHUB_SHA
          kustomize edit set image PROJECT/BROADCASTER_IMAGE=mluukkai/broadcaster:$GITHUB_SHA

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v9
        with:
          add: 'kustomization.yaml'
          message: New version released ${{ github.sha }}