apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster-dep
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        app: broadcaster
    spec:
      containers:
      - env:
        - name: NATS_URL
          value: nats://my-nats:4222
        - name: STAGING_ENV
          value: "False"
        - name: DISCORD_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              key: DISCORD_WEBHOOK_URL
              name: postgres-secret
        image: PROJECT/BROADCASTER_IMAGE
        imagePullPolicy: Always
        name: broadcaster
        resources:
          limits:
            cpu: 201m
            memory: 263Mi
          requests:
            cpu: 100m
            memory: 129Mi
---
