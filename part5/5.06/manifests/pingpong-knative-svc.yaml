apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  namespace: exercise-namespace
  name: pingpong-knative
spec:
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      containers:
        - image: PROJECT/PINGPONG_IMAGE
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "129Mi"
              cpu: "200m"
          #readinessProbe:
            #httpGet:
              #path: /pingpong/healthz
              #port: 8080
            #initialDelaySeconds: 10
            #periodSeconds: 10
            #failureThreshold: 5
            #successThreshold: 1
            #timeoutSeconds: 1
