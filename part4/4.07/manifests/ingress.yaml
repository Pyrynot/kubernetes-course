apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: exercise-namespace
  name: pingponglog-ingress
spec:
  rules:
  - http:
      paths:
      - path: /pingpong
        pathType: Prefix
        backend:
          service:
            name: pingpong-svc
            port:
              number: 8020
      - path: /pingpong/healthz
        pathType: Prefix
        backend:
          service:
            name: pingpong-svc
            port:
              number: 8020
      - path: /latest_log
        pathType: Prefix
        backend:
          service:
            name: logoutput-svc
            port:
              number: 8000
      - path: /logger/healthz
        pathType: Prefix
        backend:
          service:
            name: logoutput-svc
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: logoutput-svc
            port:
              number: 8001
