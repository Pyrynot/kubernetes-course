<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        .todo-list {
            list-style-type: none;
            padding: 0;
        }
        .todo-item input[type="checkbox"] {
            margin-right: 10px;
        }
        img {
            max-width: 300px;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Random Image</h1>
    <img src="/image" alt="Randomly fetched image">
    <h1>Todo App</h1>
    <p>Welcome to my to-do app!</p>
    <input type="text" id="todoInput" maxlength="140" placeholder="Enter your todo (max 140 characters)">
    <button id="addTodoButton">Add Todo</button>
    <ul class="todo-list" id="todoList">
    </ul>
    <script>
        document.getElementById('addTodoButton').addEventListener('click', addTodo);
        document.addEventListener('DOMContentLoaded', fetchTodos);

        async function fetchTodos() {
            const response = await fetch('/todos');
            const todos = await response.json();
            const todoList = document.getElementById('todoList');
            todoList.innerHTML = '';
            todos.forEach(todo => {
                const todoItem = document.createElement('li');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = todo.done;
                checkbox.addEventListener('change', () => toggleTodoDone(todo.id, checkbox.checked));

                const label = document.createElement('label');
                label.textContent = todo.content;

                todoItem.classList.add('todo-item');
                todoItem.appendChild(checkbox);
                todoItem.appendChild(label);
                todoList.appendChild(todoItem);
            });
        }

        async function addTodo() {
            const todoInput = document.getElementById('todoInput');
            const todoText = todoInput.value.trim();
            if (isValidTodoText(todoText)) {
                const newTodo = { content: todoText };
                const response = await fetch('/todos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newTodo)
                });
                const createdTodo = await response.json();
                const todoList = document.getElementById('todoList');
                const todoItem = document.createElement('li');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = createdTodo.done;
                checkbox.addEventListener('change', () => toggleTodoDone(createdTodo.id, checkbox.checked));

                const label = document.createElement('label');
                label.textContent = createdTodo.content;

                todoItem.classList.add('todo-item');
                todoItem.appendChild(checkbox);
                todoItem.appendChild(label);
                todoList.appendChild(todoItem);
                todoInput.value = ''; 
            }
        }

        async function toggleTodoDone(todoId, doneStatus) {
            const response = await fetch(`/todos/${todoId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ done: doneStatus })
            });

            if (response.ok) {
                fetchTodos();  
            } else {
                console.error('Failed to update todo status');
            }
        }

        function isValidTodoText(todoText) {
            return todoText.length > 0 && todoText.length <= 140;
        }
    </script>
</body>
</html>
